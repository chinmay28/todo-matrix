# Build and publish a GitHub release for the commit this is dispatched on.
#
# The tag is computed, not typed: scripts/version.mjs renders vYEAR.MONTH.PATCH
# — YEAR.MONTH from HEAD's commit date, PATCH = the commit count — so the full
# history matters (fetch-depth: 0 — a shallow checkout reports patch 0 and the
# run refuses to release it). The release body is the CHANGELOG.md section
# whose heading names the tag exactly.
#
# Three things start it: a tag, a push to main, and a manual dispatch. Only
# those — this job runs with contents: write and publishes under the
# repository's own name, so a branch listed here is a branch whose every push
# can cut a release. A push to main publishes only when the commit names its
# own version in CHANGELOG.md (see "Release notes" below); any other push to
# main is skipped.
#
# Assets (their names are the contract with anything that downloads them):
#   todo-matrix-<version>.tar.gz   the built PWA (www/) and the static server
#                                  (serve.mjs), exactly what scripts/
#                                  quickstart.sh installs under its prefix
#   todo-matrix.apk                the Android app, under a name that never
#                                  changes: .../releases/latest/download/todo-matrix.apk
#   SHA256SUMS
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the patch number is the commit count; shallow = 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # For the Android app. The runner image ships the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version
        id: version
        run: |
          VERSION="$(node scripts/version.mjs)"
          PATCH="$(node scripts/version.mjs --patch)"
          if [ "${PATCH}" = "0" ]; then
            echo "patch is 0 — unstamped build, refusing to release" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} names a commit that builds ${VERSION} — refusing to publish it" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "patch=${PATCH}" >> "$GITHUB_OUTPUT"

      # The changelog heading is the release gate: a branch push whose version
      # has no section is an ordinary commit, not a release, and is skipped —
      # so only a commit that names its own version in CHANGELOG.md publishes.
      # A tag or manual dispatch without the section is an error outright.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v tag="${{ steps.version.outputs.version }}" '
            $0 == "## " tag { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "no '## ${{ steps.version.outputs.version }}' section in CHANGELOG.md — not a release commit, skipping"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section — a tag the changelog does not name must not be published" >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.notes.outputs.release == 'true'
        run: npm ci && npm test

      # The self-host deliverable: the same dist/ and serve.mjs the installer
      # puts in $PREFIX/www and $PREFIX/serve.mjs.
      - name: Build the web app
        if: steps.notes.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm run build
          stage="todo-matrix-${VERSION}"
          mkdir -p "release/${stage}" out
          cp -r dist "release/${stage}/www"
          cp scripts/serve.mjs LICENSE "release/${stage}/"
          tar -C release -czf "out/${stage}.tar.gz" "${stage}"

      # The phone app, stamped with this release's version, carrying the
      # web app built for it (no service worker: the APK is the install).
      - name: Build todo-matrix.apk
        if: steps.notes.outputs.release == 'true'
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.patch }}"
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "expected exactly one release APK, found: ${apks[*]}" >&2
            exit 1
          fi
          unzip -l "${apks[0]}" | grep -q " assets/web/index.html$" || { echo "no web bundle in the APK" >&2; exit 1; }
          cp "${apks[0]}" ../../out/todo-matrix.apk

      - name: Checksums
        if: steps.notes.outputs.release == 'true'
        run: (cd out && sha256sum todo-matrix-* todo-matrix.apk > SHA256SUMS)

      - name: Publish release
        if: steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            echo "release ${VERSION} already exists — nothing to publish"
            exit 0
          fi
          gh release create "${VERSION}" \
            "out/todo-matrix-${VERSION}.tar.gz" \
            out/todo-matrix.apk \
            out/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file notes.md
